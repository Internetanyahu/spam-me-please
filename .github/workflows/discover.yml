name: Discover websites

on:
  push:
    paths:
      - "README.md"
      - "config.json"
      - "discovery/**"
      - "dashboard/**"
      - ".github/workflows/discover.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pages_artifact: ${{ steps.pages_upload.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover and classify public websites
        run: python discovery/run.py

      # Persist discovery results before attempting the optional Pages upload.
      - name: Commit catalog updates
        run: |
          if git diff --quiet -- data/discovered_sites.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_sites.json
          git commit -m "Refresh discovered website catalog"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare dashboard site
        run: |
          mkdir -p _site/data
          cp dashboard/index.html _site/index.html
          cp data/discovered_sites.json _site/data/discovered_sites.json

      - name: Upload Pages artifact
        id: pages_upload
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site

  deploy:
    needs: discover
    if: needs.discover.outputs.pages_artifact == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
