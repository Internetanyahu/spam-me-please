name: Discover websites

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"

permissions:
  contents: write

concurrency:
  group: website-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover and classify public websites
        run: python discovery/run.py

      - name: Commit catalog updates
        run: |
          if git diff --quiet -- data/discovered_sites.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovered_sites.json
          git commit -m "Refresh discovered website catalog"
          git push
